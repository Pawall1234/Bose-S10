; Alexa-Zentrale für Bose SoundTouch: gibt sich gegenüber Alexa als Philips-Hue-Lampe aus
; und steuert die Lautsprecher lokal über deren Web-API (Port 8090).

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    vintlabs/fauxmoESP@3.4.1
    https://github.com/me-no-dev/AsyncTCP.git#ca8ac5f
    tzapu/WiFiManager@2.0.17

[env:esp32dev]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
