; Alexa-Zentrale für Bose SoundTouch: gibt sich gegenüber Alexa als Philips-Hue-Lampe aus (Espalexa)
; und steuert die Lautsprecher lokal über deren Web-API (Port 8090).

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/Aircoookie/Espalexa.git#v2.7.0
    tzapu/WiFiManager@2.0.17

[env:d1mini]
platform = espressif8266@4.2.1
board = d1_mini
board_build.f_cpu = 160000000L  ; schneller für die verschlüsselte Skill-Verbindung

[env:esp32dev]
board = esp32dev
board_build.partitions = min_spiffs.csv

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
