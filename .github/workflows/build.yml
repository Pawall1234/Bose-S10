name: APK bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk SoundTouch-Ersatz.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SoundTouch-Ersatz-APK
          path: SoundTouch-Ersatz.apk
      - name: Als Release veröffentlichen (bei jedem Stand auf main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SoundTouch Ersatz (Build ${{ github.run_number }})
          body: APK herunterladen, auf dem Android-Handy öffnen und installieren.
          make_latest: true
          files: SoundTouch-Ersatz.apk
