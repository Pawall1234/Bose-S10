name: Alexa-Zentrale bauen

on:
  push:
    branches: [main]
    paths: ["alexa-zentrale/**", ".github/workflows/zentrale.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('alexa-zentrale/platformio.ini') }}
      - name: PlatformIO installieren
        run: pip install platformio==6.1.16
      - name: Firmware bauen
        working-directory: alexa-zentrale
        run: pio run -e d1mini -e esp32dev -e esp32c3
      - name: Eine Datei zum Aufspielen pro Chip erzeugen
        working-directory: alexa-zentrale
        run: |
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          B=.pio/build
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32 merge_bin -o ../Zentrale-ESP32.bin \
            0x1000 $B/esp32dev/bootloader.bin 0x8000 $B/esp32dev/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/esp32dev/firmware.bin
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32c3 merge_bin -o ../Zentrale-ESP32-C3.bin \
            0x0 $B/esp32c3/bootloader.bin 0x8000 $B/esp32c3/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/esp32c3/firmware.bin
          cp $B/d1mini/firmware.bin ../Zentrale-D1-mini.bin
          ls -la ../Zentrale-*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: Alexa-Zentrale
          path: Zentrale-*.bin
      - name: Als Release veröffentlichen
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zentrale-${{ github.run_number }}
          name: Alexa-Zentrale (Build ${{ github.run_number }})
          body: |
            Firmware für die ESP32-Mini-Zentrale. Die passende Datei wählen:
            - Zentrale-D1-mini.bin für den Wemos/LOLIN D1 mini (ESP8266)
            - Zentrale-ESP32.bin für „ESP32 DevKitC“ und ähnliche
            - Zentrale-ESP32-C3.bin für „ESP32-C3“-Boards
            Aufspielen am PC mit Chrome oder Edge über https://espressif.github.io/esptool-js/ (Adresse 0x0).
          make_latest: false
          files: Zentrale-*.bin
